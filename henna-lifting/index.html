<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>変なものリフティング</title>
<meta name="description" content="おにぎり、生卵、すいか、スマホ…変なものを蹴り上げ続けるリフティングゲーム。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍙</text></svg>">
<meta property="og:title" content="変なものリフティング">
<meta property="og:description" content="おにぎり、生卵、すいか、スマホ…何回蹴り上げられる？">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
  /* 青空と芝生のグラウンド1枚で見せる、単一テーマのゲーム画面 */
  :root {
    --sky: #74c0fc; --grass: #40c057; --ink: #1c3d5a; --ink-soft: #4d6a82;
    --card: rgba(255,255,255,0.95); --line: #e3eaf0; --accent: #f76707; --gold: #ffd43b;
    --font-display: "Dela Gothic One", "Hiragino Sans", system-ui, sans-serif;
    --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--grass); font-family: var(--font-body); color: var(--ink); }
  canvas { display: block; touch-action: none; -webkit-user-select: none; user-select: none; }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(28,61,90,0.25); }
  .overlay[hidden] { display: none; }
  .panel { width: min(420px, 100%); max-height: 100%; overflow-y: auto; background: var(--card); border-radius: 20px; padding: 20px 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
  h1 { margin: 0 0 4px; font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; text-align: center; text-wrap: balance; letter-spacing: .02em; }
  .lead { margin: 0 0 14px; text-align: center; font-size: .9rem; color: var(--ink-soft); }
  .object-btn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; margin-bottom: 8px; border: 2px solid var(--line); border-radius: 14px; background: #fff; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .object-btn:active { transform: scale(0.98); border-color: var(--accent); }
  .object-btn:focus-visible, .actions > *:focus-visible, #mute:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .object-icon { font-size: 2rem; width: 44px; text-align: center; }
  .tofu-icon { display: inline-block; width: 28px; height: 28px; border-radius: 5px; background: #fffdf5; border: 2px solid #e9e3cf; vertical-align: middle; }
  .object-text { flex: 1; display: flex; flex-direction: column; }
  .object-text small { color: #6b8499; font-size: .78rem; }
  .object-best { font-size: .78rem; color: var(--accent); font-weight: 700; white-space: nowrap; }
  .result-title { margin: 0; text-align: center; font-size: 1.1rem; color: #4d6a82; }
  .result-score { margin: 4px 0; text-align: center; font-family: var(--font-display); font-weight: 400; font-size: 3.4rem; font-variant-numeric: tabular-nums; }
  .result-extra { margin: 0; text-align: center; font-weight: 700; }
  .result-line { margin: 10px 0 16px; text-align: center; font-size: 1.05rem; }
  .record { display: block; margin: 0 auto 6px; width: fit-content; padding: 2px 10px; border-radius: 999px; background: var(--gold); font-weight: 800; font-size: .85rem; }
  .record[hidden] { display: none; }
  .actions { display: grid; gap: 8px; }
  .actions { grid-template-columns: 1fr 1fr; }
  .actions > * { display: block; padding: 14px; border: none; border-radius: 14px; font: inherit; font-weight: 700; font-size: 1rem; text-align: center; text-decoration: none; cursor: pointer; }
  .actions .primary, .actions .secondary { grid-column: 1 / -1; }
  .primary { background: var(--accent); color: #fff; }
  .secondary { background: #e7f0f7; color: var(--ink); }
  .share { background: var(--ink); color: #fff; }
  .copy { background: #fff; color: var(--ink); border: 2px solid var(--line) !important; }
  #mute { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); width: 40px; height: 40px; border: none; border-radius: 50%; background: rgba(255,255,255,0.8); font-size: 1.2rem; cursor: pointer; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<button id="mute" aria-label="音のオンオフ">🔊</button>

<div id="menu" class="overlay">
  <div class="panel">
    <h1>変なものリフティング</h1>
    <p class="lead">モノをタップして蹴り上げよう。何を蹴る？</p>
    <div id="object-list"></div>
  </div>
</div>

<div id="result" class="overlay" hidden>
  <div class="panel">
    <span id="result-record" class="record" hidden>自己ベスト更新！</span>
    <p id="result-title" class="result-title"></p>
    <p id="result-score" class="result-score"></p>
    <p id="result-extra" class="result-extra"></p>
    <p id="result-line" class="result-line"></p>
    <div class="actions">
      <button id="retry" class="primary">もう一回</button>
      <a id="share" class="share" href="https://twitter.com/intent/tweet" target="_blank" rel="noopener">Xに投稿</a>
      <button id="copy" class="copy">結果をコピー</button>
      <button id="change" class="secondary">モノを変える</button>
    </div>
  </div>
</div>

<script type="module" src="src/game.js"></script>
</body>
</html>
